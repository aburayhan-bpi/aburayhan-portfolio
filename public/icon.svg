<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Brand Gradients -->
    <linearGradient id="cobaltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1E2536" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#121622" />
      <stop offset="100%" stop-color="#090A0F" />
    </linearGradient>
    <!-- Glow filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#2563EB" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Squircle Base with high-tech border -->
  <rect x="2" y="2" width="96" height="96" rx="26" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2"/>
  
  <!-- Subtle Grid Accent lines inside logo -->
  <path d="M 2 50 H 98" stroke="#1E2536" stroke-width="0.75" stroke-dasharray="2 4" opacity="0.4"/>
  <path d="M 50 2 V 98" stroke="#1E2536" stroke-width="0.75" stroke-dasharray="2 4" opacity="0.4"/>

  <!-- Iconic Monogram "AR" -->
  <g filter="url(#glow)">
    <!-- Letter 'A' Left Diagonal Stem -->
    <path d="M 23 75 L 43 25 C 44.5 21.5 48.5 21.5 50 25 L 61 52" 
          stroke="url(#cobaltGrad)" 
          stroke-width="7.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
          
    <!-- 'A' Crossbar (connecting smoothly into R) -->
    <path d="M 31 56 H 68" 
          stroke="url(#cobaltGrad)" 
          stroke-width="6.5" 
          stroke-linecap="round"/>

    <!-- Letter 'R' Upper Loop & Spine -->
    <path d="M 50 24 H 68 C 76.5 24 81 30 79 38 C 77 46 70.5 49.5 60 50" 
          stroke="#F1F5F9" 
          stroke-width="7" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- 'R' Dynamic Angled Leg -->
    <path d="M 61 50 L 76 75" 
          stroke="url(#cobaltGrad)" 
          stroke-width="7.5" 
          stroke-linecap="round"/>
  </g>

  <!-- Live Pulse Dot (Engineering Status Indicator) -->
  <circle cx="78" cy="22" r="3.5" fill="#10B981" />
  <circle cx="78" cy="22" r="6" stroke="#10B981" stroke-width="1.2" opacity="0.4" />
</svg>
